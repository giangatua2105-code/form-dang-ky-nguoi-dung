<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form đăng ký người dùng</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #e0f2ff 0%, #f5faff 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        margin: 0;
      }

      .form-container {
        width: 100%;
        max-width: 440px;
        background: #fff;
        padding: 40px 32px;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 102, 255, 0.12);
      }

      h1 {
        text-align: center;
        color: #0066ff;
        font-size: 24px;
        margin-bottom: 8px;
      }

      .subtitle {
        text-align: center;
        color: #666;
        font-size: 14px;
        margin-bottom: 28px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #333;
        margin-bottom: 6px;
      }

      .required {
        color: #e11d48;
      }

      input[type="text"],
      input[type="email"],
      input[type="tel"] {
        width: 100%;
        height: 46px;
        padding: 0 14px;
        font-size: 15px;
        border: 1.5px solid #d0d7de;
        border-radius: 10px;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        font-family: inherit;
      }

      input:focus {
        border-color: #0066ff;
        box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.15);
      }

      .radio-group {
        display: flex;
        gap: 18px;
        padding: 6px 0;
      }

      .radio-group label {
        font-weight: normal;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        margin-bottom: 0;
      }

      button {
        width: 100%;
        height: 48px;
        background: #0066ff;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 10px;
        transition: background 0.2s;
      }

      button:hover {
        background: #0052cc;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h1>Đăng ký người dùng</h1>
      <p class="subtitle">Vui lòng điền đầy đủ thông tin bên dưới</p>

      <form
        action="http://demo.codegym.vn/6/registration_form/register.php"
        method="POST"
      >
        <div class="form-group">
          <label>Họ và tên <span class="required">*</span></label>
          <input
            type="text"
            name="name"
            placeholder="Nhập họ và tên"
            required
          />
        </div>

        <div class="form-group">
          <label>Email <span class="required">*</span></label>
          <input type="email" name="email" placeholder="Nhập email" required />
        </div>

        <div class="form-group">
          <label>Số điện thoại <span class="required">*</span></label>
          <input
            type="tel"
            name="phone"
            placeholder="Nhập số điện thoại"
            required
          />
        </div>

        <div class="form-group">
          <label>Giới tính</label>
          <div class="radio-group">
            <label><input type="radio" name="gender" value="nam" /> Nam</label>
            <label><input type="radio" name="gender" value="nu" /> Nữ</label>
            <label
              ><input type="radio" name="gender" value="khac" /> Khác</label
            >
          </div>
        </div>

        <button type="submit">Đăng ký</button>
      </form>
    </div>
  </body>
</html>
